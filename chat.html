
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--bg:#fff;--panel:#fff;--text:#171717;--muted:#737373;--border:#e5e7eb;--input:#f9fafb;--hover:#f3f4f6;--primary:#2563eb;--bubble:#eff6ff;--danger:#dc2626}
body.dark{color-scheme:dark;--bg:#111318;--panel:#191c23;--text:#f5f5f5;--muted:#a1a1aa;--border:#30343d;--input:#222630;--hover:#292d37;--primary:#648cff;--bubble:#252f48;--danger:#f87171}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:background .2s,color .2s}
button,input{font:inherit}
button{cursor:pointer;border:none}
button:disabled{opacity:.6;cursor:wait}
header{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:var(--panel);z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:700}
.logo{width:40px;height:40px;border-radius:13px;background:var(--primary);color:white;display:grid;place-items:center;font-size:22px}
.icon-btn,.logout-btn{background:var(--input);color:var(--text);border:1px solid var(--border);padding:10px 12px;border-radius:12px}
main{max-width:760px;margin:0 auto;padding:30px 18px}
.welcome{margin-bottom:25px}
.welcome h1{font-size:28px;margin:0 0 8px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
.search-wrap{position:relative}
.search-box{display:flex;gap:9px;padding:7px;border:1px solid var(--border);border-radius:15px;background:var(--input)}
.search-box input{min-width:0;flex:1;background:transparent;color:var(--text);border:none;outline:none;padding:12px 10px}
.primary-btn{background:var(--primary);color:white;border-radius:11px;padding:12px 18px;font-weight:600}
.primary-btn:disabled{opacity:.6;cursor:wait}
#status{min-height:22px;margin:12px 3px;color:var(--muted);font-size:14px}
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--border);border-radius:13px;box-shadow:0 10px 25px #00000012;overflow:hidden;z-index:10;display:none;max-height:330px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 13px;background:var(--panel);color:var(--text);border-bottom:1px solid var(--border)}
.suggestion:last-child{border-bottom:0}
.suggestion:hover{background:var(--hover)}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin:32px 0 14px}
.section-heading h2{font-size:19px;margin:0}
.count{color:var(--muted);font-size:13px}
.list{border:1px solid var(--border);border-radius:16px;overflow:hidden}
.friend-row{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--border)}
.friend-row:last-child{border-bottom:none}
.friend-row:hover{background:var(--hover)}
.friend-open{flex:1;min-width:0;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;color:var(--text);padding:0}
.avatar{width:47px;height:47px;border-radius:50%;background:var(--bubble);color:var(--primary);display:grid;place-items:center;font-size:19px;font-weight:700;flex-shrink:0}
.details{min-width:0;flex:1}
.name{font-weight:700;margin-bottom:5px;overflow-wrap:anywhere}
.subtext{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.empty{text-align:center;padding:30px 15px;color:var(--muted);line-height:1.6}
.profile{margin-top:25px;padding:15px;border:1px solid var(--border);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.profile-info{min-width:0}
.profile-info strong{display:block;margin-bottom:5px}
.profile-info span{color:var(--muted);overflow-wrap:anywhere}
.result-card{display:none;margin-top:14px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--panel)}
.result-card.show{display:block}
.result-top{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.result-actions{display:flex;gap:9px;flex-wrap:wrap}
.secondary-btn{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 15px}
.delete-btn{background:transparent;color:var(--danger);border:1px solid var(--border);border-radius:10px;padding:9px 11px;flex-shrink:0}
@media(max-width:480px){
header{padding:0 13px}
main{padding:24px 13px}
.welcome h1{font-size:24px}
.brand{font-size:18px}
.primary-btn{padding:12px 13px}
.profile{align-items:flex-start}
.friend-row{gap:8px;padding:11px}
.friend-open{gap:10px}
.avatar{width:43px;height:43px}
.delete-btn{padding:8px}
}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">✉</div>Private Chat</div>
  <button class="icon-btn" id="themeToggle" type="button">🌙 Dark</button>
</header>

<main>
  <section class="welcome">
    <h1>Your messages</h1>
    <p>Search a username to view their profile and add them as a friend.</p>
  </section>

  <div class="search-wrap">
    <form class="search-box" id="searchForm">
      <input id="usernameSearch" type="text"
        placeholder="Search username..."
        autocomplete="off" required>
      <button class="primary-btn" type="submit">Search</button>
    </form>
    <div class="suggestions" id="suggestions" role="listbox"></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <section class="result-card" id="resultCard">
    <div class="result-top">
      <div class="avatar" id="resultAvatar">?</div>
      <div class="details">
        <div class="name" id="resultName">@username</div>
        <div class="subtext">Private Chat user</div>
      </div>
    </div>
    <div class="result-actions">
      <button class="primary-btn" id="addFriendBtn" type="button">＋ Add Friend</button>
      <button class="secondary-btn" id="openChatBtn" type="button" hidden>Open Chat</button>
    </div>
  </section>

  <div class="section-heading">
    <h2>Your Friends</h2>
    <span class="count" id="friendCount">0 friends</span>
  </div>

  <section class="list" id="friendList">
    <div class="empty">Your friends will appear here.<br>Search a username and tap Add Friend.</div>
  </section>

  <section class="profile">
    <div class="profile-info">
      <strong id="myUsername">Your account</strong>
      <span id="myEmail">Checking login...</span>
    </div>
    <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  onValue,
  set,
  remove
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDxPkDQivEN8YtTgUbER8g3wdk7paAuEY",
  authDomain: "jee1-3c96a.firebaseapp.com",
  databaseURL: "https://jee1-3c96a-default-rtdb.firebaseio.com",
  projectId: "jee1-3c96a",
  storageBucket: "jee1-3c96a.firebasestorage.app",
  messagingSenderId: "92796387355",
  appId: "1:92796387355:web:fda978d6827ecfee7e78be",
  measurementId: "G-MPZTE4Q2R1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let me = null;
let myUsername = "";
let usernameDirectory = {};
let selectedUser = null;
let friendsCache = {};
let stopFriendsListener = null;
let stopDirectoryListener = null;
let directoryLoaded = false;

$("themeToggle").addEventListener("click", () => {
  const dark = document.body.classList.toggle("dark");
  $("themeToggle").textContent = dark ? "☀️ Light" : "🌙 Dark";
});

function showStatus(message) {
  $("status").textContent = message;
}

function normalizeUsername(value) {
  return String(value || "").trim().toLowerCase().replace(/^@/, "");
}

function goToChat(uid, username) {
  const url = new URL("conversation.html", window.location.href);
  url.searchParams.set("uid", uid);
  url.searchParams.set("username", username);
  window.location.href = url.toString();
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.replace("index.html");
    return;
  }

  me = user;
  $("myEmail").textContent = user.email || "Google account";

  try {
    const profileSnap = await get(ref(db, "users/" + user.uid));
    const profile = profileSnap.val() || {};

    myUsername = normalizeUsername(profile.username);
    $("myUsername").textContent =
      myUsername ? "@" + myUsername : "Username not set";

    if (!myUsername) {
      showStatus("Your username is missing. Please check registration.");
    }

    if (stopDirectoryListener) stopDirectoryListener();

    stopDirectoryListener = onValue(
      ref(db, "usernames"),
      snapshot => {
        usernameDirectory = snapshot.val() || {};
        directoryLoaded = true;
        renderSuggestions();
      },
      error => {
        console.error("Username directory error:", error);
        showStatus("Suggestions access denied. Check Firebase Rules.");
      }
    );

    listenToFriends();

  } catch (error) {
    console.error("Profile error:", error);
    showStatus("Could not load profile. Check Firebase Rules.");
  }
});

function hideSuggestions() {
  $("suggestions").classList.remove("show");
  $("suggestions").replaceChildren();
}

function renderSuggestions() {
  const query = normalizeUsername($("usernameSearch").value);
  const box = $("suggestions");
  box.replaceChildren();

  if (!query || !directoryLoaded || !me) {
    box.classList.remove("show");
    return;
  }

  const matches = Object.keys(usernameDirectory)
    .filter(name =>
      name.startsWith(query) &&
      usernameDirectory[name] !== me.uid
    )
    .sort()
    .slice(0, 8);

  if (!matches.length) {
    box.classList.remove("show");
    return;
  }

  for (const username of matches) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "suggestion";
    button.setAttribute("role", "option");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = username.charAt(0).toUpperCase();

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "@" + username;

    const subtitle = document.createElement("div");
    subtitle.className = "subtext";
    subtitle.textContent = "View profile";

    details.append(name, subtitle);
    button.append(avatar, details);

    button.addEventListener("click", () => {
      $("usernameSearch").value = username;
      hideSuggestions();
      showUserProfile(username);
    });

    box.appendChild(button);
  }

  box.classList.add("show");
}

$("usernameSearch").addEventListener("input", renderSuggestions);
$("usernameSearch").addEventListener("focus", renderSuggestions);

document.addEventListener("click", event => {
  if (
    !$("searchForm").contains(event.target) &&
    !$("suggestions").contains(event.target)
  ) {
    hideSuggestions();
  }
});

async function showUserProfile(username) {
  if (!me) return;

  username = normalizeUsername(username);
  $("resultCard").classList.remove("show");
  selectedUser = null;

  if (!username) {
    showStatus("Enter a username.");
    return;
  }

  if (!directoryLoaded) {
    showStatus("Loading users. Please try again in a moment.");
    return;
  }

  const targetUid = usernameDirectory[username];

  if (typeof targetUid !== "string" || !targetUid) {
    showStatus("User not found. Check the spelling.");
    return;
  }

  if (targetUid === me.uid) {
    showStatus("That's your own username!");
    return;
  }

  selectedUser = { uid: targetUid, username };

  $("resultAvatar").textContent = username.charAt(0).toUpperCase();
  $("resultName").textContent = "@" + username;

  const alreadyFriend = Boolean(friendsCache[targetUid]);

  $("addFriendBtn").hidden = alreadyFriend;
  $("openChatBtn").hidden = !alreadyFriend;
  $("resultCard").classList.add("show");

  showStatus(
    alreadyFriend
      ? "This user is already your friend."
      : "User found! Add them to Your Friends."
  );
}

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideSuggestions();

  if (!me) {
    showStatus("Please wait for login to finish.");
    return;
  }

  const username = normalizeUsername($("usernameSearch").value);

  if (!username) {
    showStatus("Enter a username.");
    return;
  }

  await showUserProfile(username);
});

$("addFriendBtn").addEventListener("click", async () => {
  if (!me || !selectedUser) return;

  const button = $("addFriendBtn");
  button.disabled = true;

  try {
    await set(
      ref(db, `users/${me.uid}/friends/${selectedUser.uid}`),
      {
        username: selectedUser.username,
        addedAt: Date.now()
      }
    );

    showStatus("Friend added! They are now in Your Friends.");
    $("addFriendBtn").hidden = true;
    $("openChatBtn").hidden = false;

  } catch (error) {
    console.error("Add friend error:", error);
    showStatus("Could not add friend. Check Firebase Rules.");
  } finally {
    button.disabled = false;
  }
});

$("openChatBtn").addEventListener("click", () => {
  if (selectedUser) {
    goToChat(selectedUser.uid, selectedUser.username);
  }
});

function listenToFriends() {
  if (stopFriendsListener) stopFriendsListener();

  stopFriendsListener = onValue(
    ref(db, `users/${me.uid}/friends`),
    snapshot => {
      friendsCache = snapshot.val() || {};
      renderFriends();

      if (selectedUser) {
        const isFriend = Boolean(friendsCache[selectedUser.uid]);
        $("addFriendBtn").hidden = isFriend;
        $("openChatBtn").hidden = !isFriend;
      }
    },
    error => {
      console.error("Friends list error:", error);
      showStatus("Could not load friends. Check Firebase Rules.");
    }
  );
}

function renderFriends() {
  const list = $("friendList");
  list.replaceChildren();

  const entries = Object.entries(friendsCache)
    .filter(([uid, info]) => uid && uid !== me.uid && info);

  $("friendCount").textContent =
    `${entries.length} ${entries.length === 1 ? "friend" : "friends"}`;

  if (!entries.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      "Your friends will appear here. Search a username and tap Add Friend.";
    list.appendChild(empty);
    return;
  }

  entries.sort((a, b) =>
    String(a[1]?.username || "").localeCompare(
      String(b[1]?.username || "")
    )
  );

  for (const [uid, info] of entries) {
    const username = String(info?.username || "user");

    const row = document.createElement("div");
    row.className = "friend-row";

    const open = document.createElement("button");
    open.type = "button";
    open.className = "friend-open";
    open.setAttribute("aria-label", "Open chat with @" + username);

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = username.charAt(0).toUpperCase();

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "@" + username;

    const subtitle = document.createElement("div");
    subtitle.className = "subtext";
    subtitle.textContent = "Tap to open chat";

    const arrow = document.createElement("div");
    arrow.className = "subtext";
    arrow.textContent = "›";

    details.append(name, subtitle);
    open.append(avatar, details, arrow);

    open.addEventListener("click", () => {
      goToChat(uid, username);
    });

    const del = document.createElement("button");
    del.type = "button";
    del.className = "delete-btn";
    del.textContent = "Delete";
    del.title = "Remove friend";
    del.setAttribute("aria-label", "Delete @" + username + " from friends");

    del.addEventListener("click", async () => {
      if (!confirm(`Remove @${username} from Your Friends?`)) return;

      del.disabled = true;

      try {
        await remove(ref(db, `users/${me.uid}/friends/${uid}`));

        if (selectedUser?.uid === uid) {
          $("resultCard").classList.remove("show");
          selectedUser = null;
        }

        showStatus(`@${username} removed from Your Friends.`);

      } catch (error) {
        console.error("Delete friend error:", error);
        showStatus("Could not remove friend. Check Firebase Rules.");
      } finally {
        del.disabled = false;
      }
    });

    row.append(open, del);
    list.appendChild(row);
  }
}

$("logoutBtn").addEventListener("click", async () => {
  try {
    if (stopFriendsListener) stopFriendsListener();
    if (stopDirectoryListener) stopDirectoryListener();

    await signOut(auth);
    window.location.replace("index.html");

  } catch (error) {
    console.error("Logout error:", error);
    showStatus("Could not log out. Please try again.");
  }
});
</script>
</body>
</html>
